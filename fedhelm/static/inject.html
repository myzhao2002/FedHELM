<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FedHELM · 故障注入</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.7 'Microsoft YaHei',sans-serif;background:#f1f5f6;color:#18373c}header{background:#112f37;color:white;padding:24px 6%}h1{margin:0;font-size:25px}a{color:#087d80}header a{color:#b1ddda;margin-right:22px}main{max-width:920px;margin:35px auto;padding:0 20px}.panel{background:white;border:1px solid #d9e5e6;border-radius:12px;padding:26px;margin-bottom:20px}label{display:block;margin:18px 0 7px}select,button{font:inherit;padding:12px;border-radius:7px;border:1px solid #b5cecf}select{width:100%;background:white;color:#18373c}button{cursor:pointer;background:#087d80;color:white;margin:20px 10px 0 0}button:disabled{opacity:.5;cursor:wait}.muted{color:#758a8f;font-size:13px}#message{white-space:pre-wrap}table{border-collapse:collapse;width:100%}td{border-bottom:1px solid #edf2f3;padding:12px 5px}</style><header><h1>故障注入实验台</h1><nav><a href="/">系统总览 ↗</a><a href="/inject">故障注入</a><a href="/lab">训练与调试</a></nav></header><main><section class="panel"><h2>选择测试节点与故障</h2><p>注入后，后台调度器会自动发现异常并尝试修复。在系统总览页可观察每一步操作。</p><p id="monitor" class="muted">读取自动调度状态…</p><label for="node">目标节点</label><select id="node"><option value="a">A 节点 · 支持本地小模型</option><option value="b">B 节点</option><option value="c">C 节点</option></select><label for="fault">故障类型</label><select id="fault"><option value="service_down">服务停止</option><option value="config_error">配置错误</option><option value="pool_exhausted">连接池耗尽</option></select><button id="inject">注入故障</button><button id="restore">手动恢复该节点</button><p id="message" role="status"></p><a href="/" target="_blank">在另一个页面打开系统总览 →</a></section><section class="panel"><h2>实际影响范围</h2><table><tr><td>服务停止</td><td>停止本项目业务子进程；K8s模式缩容对应业务Deployment。</td></tr><tr><td>配置错误</td><td>修改测试业务配置，让实际请求失败。</td></tr><tr><td>连接池耗尽</td><td>占住测试业务的SQLite连接，让实际请求超时。</td></tr></table><p class="muted">只操作项目测试服务和数据，不注入宿主机CPU、内存、磁盘或网络故障。采集训练数据请在“训练与调试”页手动执行。</p></section></main><script>
const $=s=>document.getElementById(s);async function status(){try{let r=await fetch('/ui/monitor');if(!r.ok)throw Error();let s=await r.json();$('monitor').textContent=s.enabled?'自动调度已启用：注入后通常在下一次10秒巡检开始处理。':'自动调度已暂停：请到系统总览启用，或手动恢复。'}catch{$('monitor').textContent='调度服务未连接'}}async function inject(restore){$('inject').disabled=$('restore').disabled=true;$('message').textContent='正在操作测试业务…';try{let r=await fetch('/ui/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'inject',node:$('node').value,fault:restore?'healthy':$('fault').value})});let d=await r.json();if(!r.ok)throw Error(d.detail||r.status);$('message').textContent=restore?'已执行手动恢复。':'故障注入成功，请查看系统总览的自动处置时间线。'}catch(e){$('message').textContent='操作未完成：'+e.message}finally{$('inject').disabled=$('restore').disabled=false;status()}}$('inject').onclick=()=>inject(false);$('restore').onclick=()=>inject(true);status();setInterval(status,10000);
</script></html>

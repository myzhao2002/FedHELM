<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FedHELM · 独立故障实验站</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#203146;font:14px/1.7 "Segoe UI","Microsoft YaHei",sans-serif}header{background:#111f35;color:white;padding:22px max(25px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center}header small{color:#a6b4c9}main{max-width:1120px;margin:38px auto;padding:0 22px}h1{font-size:28px;margin:8px 0}h2{font-size:17px}small,.hint{color:#7d8ca1}a{color:#287cba;text-decoration:none}header a{color:#8edbd8}section{background:white;border:1px solid #e0e7ee;border-radius:12px;padding:25px;margin:22px 0}.form{display:grid;grid-template-columns:1fr 1fr;gap:22px}label{display:block;font-size:12px;color:#76869a}select,button{font:inherit;border:1px solid #d7e1e9;border-radius:7px;padding:11px 15px}select{width:100%;background:white;color:#273e55;margin:7px 0 14px}button{cursor:pointer;background:white;color:#344c65}button.primary{background:#d07936;border-color:#d07936;color:white}button:disabled{opacity:.5}.buttons{display:flex;gap:12px;margin-top:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.node{border:1px solid #e4eaf0;border-radius:8px;padding:13px;background:#fafcfd}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#32a892;margin-right:8px}.dot.bad{background:#d77754}.node small{display:block}.notice{padding:15px;border-left:3px solid #4f94bc;background:#f1f8fc}#result{overflow-wrap:anywhere}#error{color:#b94f40}.badge{padding:4px 9px;border-radius:4px;background:#e9f5f1;color:#248474;font-size:12px}@media(max-width:700px){.form{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}header{padding:18px;gap:20px}}
</style></head><body><header><div><strong>FedHELM / FAULT LAB</strong><br><small>独立故障实验入口</small></div><a id="console" target="_blank" rel="noreferrer">打开管理平台 ↗</a></header><main><small>TEST OPERATIONS</small><h1>创建一场可追踪的故障实验</h1><p class="hint">本页面只改变目标测试业务。管理平台从实际观测发现异常，诊断请求不接收实验标签。</p><section><h2>实验配置</h2><div class="form"><div><label for="node">逻辑设备</label><select id="node"></select></div><div><label for="fault">故障类型</label><select id="fault"></select></div></div><p id="mechanism" class="notice"></p><div class="buttons"><button class="primary" id="inject">注入故障</button><button id="restore">恢复所选业务</button></div><p id="error" role="status"></p><div id="result"></div></section><section><h2>节点业务状态 <span id="updated" class="hint"></span></h2><div class="cards" id="nodes">正在连接…</div></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let config,busy=false;
async function api(path,options){const r=await fetch(path,options),d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
function mechanism(){$('mechanism').textContent=config.faults.find(f=>f.id===$('fault').value)?.mechanism||''}
async function refresh(){try{const d=await api('/api/status');$('nodes').innerHTML=d.nodes.map(n=>`<div class="node"><span class="dot ${n.online&&n.business_healthy?'':'bad'}"></span><b>${esc(n.id.toUpperCase())}</b><small>${n.tier}类 · ${!n.online?'端侧未连接':n.business_healthy?'业务正常':'业务异常 / 等待采样'}</small></div>`).join('');$('updated').textContent='· '+new Date().toLocaleTimeString()}catch(e){$('nodes').textContent=e.message}}
async function run(fault){if(busy)return;busy=true;$('inject').disabled=$('restore').disabled=true;$('error').textContent='';$('result').textContent='正在执行目标测试业务操作…';try{const d=await api('/api/inject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({node:$('node').value,fault})});$('result').innerHTML=`<p><span class="badge">${fault==='healthy'?'恢复请求已完成':'注入已执行'}</span></p><p>实验编号：${esc(d.task_id)}</p><a href="${esc(d.task_url)}" target="_blank" rel="noreferrer">进入管理平台查看诊断与处置过程 ↗</a>`;await refresh()}catch(e){$('result').textContent='';$('error').textContent=e.message}finally{busy=false;$('inject').disabled=$('restore').disabled=false}}
$('inject').onclick=()=>run($('fault').value);$('restore').onclick=()=>run('healthy');$('fault').onchange=mechanism;
(async()=>{try{config=await api('/api/config');$('console').href=config.edge_url+'/topology';$('node').innerHTML=config.nodes.map(n=>`<option value="${esc(n.id)}">${esc(n.id.toUpperCase())} · ${n.tier}类</option>`).join('');$('fault').innerHTML=config.faults.filter(f=>f.implemented).map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('');mechanism();await refresh()}catch(e){$('error').textContent=e.message}})();setInterval(()=>{if(!busy)refresh()},8000);
</script></body></html>
